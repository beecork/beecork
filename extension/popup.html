<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    button { padding: 5px 10px; cursor: pointer; }
    .muted { color: #888; font-size: 12px; }
    .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
    .ok { background: #e6f4ea; color: #137333; }
    .warn { background: #fef7e0; color: #b06000; }
    .site { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid #eee; }
    .site .origin { flex: 1; font: 12px monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site label { font-size: 12px; white-space: nowrap; }
    .x { cursor: pointer; color: #c5221f; border: none; background: none; font-size: 14px; padding: 0 2px; }
    hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #202124; color: #e8eaed; }
      hr, .site { border-color: #3c4043; }
      .ok { background: #1e3a29; color: #81c995; }
      .warn { background: #3a3320; color: #fdd663; }
    }
  </style>
</head>
<body>
  <h1>🦴 Beecork Skeleton</h1>
  <div id="status" class="muted">…</div>

  <hr />
  <div class="row">
    <label><input type="checkbox" id="enabled" /> <b>Capture enabled</b></label>
  </div>

  <hr />
  <div class="row">
    <b style="flex:1">Approved sites</b>
    <button id="pair">Pair this site</button>
  </div>
  <div id="sites"></div>
  <div id="noSites" class="muted">No sites approved yet. Open your app and click “Pair this site”.</div>

  <script src="popup.js"></script>
</body>
</html>
